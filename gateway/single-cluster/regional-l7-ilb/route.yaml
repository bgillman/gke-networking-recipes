kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: store-route-ilb
  namespace: store
  labels:
    gateway: single-cluster-gateway-rilb
spec:
  hostnames:
  - "store.example.internal"
  rules:
  - backendRefs:
    - name: store-v1
      port: 8080
      weight: 50
    - name: store-v2
      port: 8080
      weight: 50